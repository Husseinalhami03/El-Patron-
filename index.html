<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211b17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kunden-Tagebuch"><link rel="manifest" href="manifest.json"><title>Kunden-Tagebuch</title><style>
*{box-sizing:border-box} :root{--bg:#f6f2ed;--card:#fff;--text:#211b17;--muted:#756b63;--line:#e7ded5;--accent:#211b17;--soft:#f0e9e2}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:700px;margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:27px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}input,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #d9cec4;border-radius:11px;padding:11px;background:var(--card);color:var(--text);min-height:46px}input[type=date],input[type=time],input[type=month]{appearance:none;-webkit-appearance:none}textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff;width:100%;margin-top:12px}.small{background:var(--soft);color:var(--text);padding:8px 10px;font-size:13px}.danger{background:#fff0ee;color:#a33127}.icon{background:var(--soft);border:0;border-radius:12px;padding:10px 12px;font-size:19px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--bg);border-radius:13px;padding:10px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}.sectiontitle{font-size:19px;font-weight:800;margin-bottom:10px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.week{text-align:center;color:var(--muted);font-size:10px;font-weight:700}.calday{min-height:43px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;position:relative}.calday.today{outline:2px solid var(--accent)}.calday.has{font-weight:800}.dot{position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}.day{margin-top:18px}.dayhead{display:flex;justify-content:space-between;align-items:end;gap:8px}.date{font-size:18px;font-weight:800}.end{text-align:right;font-size:12px;color:var(--muted)}.count{font-size:12px;color:var(--muted);margin:3px 0 6px}.row{border-top:1px solid #eee6df;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:7px}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.note{margin-top:5px}.money{text-align:right;font-weight:800}.tip{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;margin-top:7px}.month{border-top:1px solid #eee6df;padding:11px 0}.month:first-child{border-top:0}.monthrow{display:flex;justify-content:space-between;gap:8px}.monthname{font-weight:750}.monthsum{text-align:right;font-weight:800}.monthtip,.monthcount{font-size:12px;color:var(--muted);margin-top:2px}.empty{text-align:center;color:var(--muted);padding:20px}.footer{text-align:center;color:#8b8179;font-size:10px;margin-top:25px}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5;padding:12px}.modal.show{display:flex}.sheet{background:var(--card);width:min(700px,100%);margin:auto;border-radius:22px;padding:18px;max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.setting{margin:12px 0}.setting input[type=color]{padding:3px}
@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.title{font-size:24px}}
</style></head><body><main><div class="top"><div><div class="title" id="title">Kunden-Tagebuch</div><div class="sub" id="sub">Kunden, Leistungen, Umsatz & Trinkgeld</div></div><button class="icon" id="settings">⚙️</button></div>
<section class="card"><div class="grid"><div><label>Kunde</label><input id="name" placeholder="z. B. Papi"></div><div><label>Betrag (€)</label><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="25,00"></div><div><label>Trinkgeld (€)</label><input id="tip" type="number" inputmode="decimal" step="0.01" min="0" placeholder="5,00"></div><div><label>Datum</label><input id="date" type="date"></div><div><label>Uhrzeit</label><input id="time" type="time"></div><div class="full"><label>Leistung / Was wurde gemacht?</label><input id="service" placeholder="z. B. Haarschnitt + Bart"></div><div class="full"><label>Notiz (optional)</label><textarea id="note" placeholder="z. B. Kunde zufrieden"></textarea></div></div><button class="btn primary" id="save">Eintrag speichern</button><button class="btn small hidden" id="cancel" style="width:100%;margin-top:8px">Bearbeiten abbrechen</button></section>
<section class="card"><div class="stats"><div class="stat"><span>Umsatz</span><b id="total">0,00 €</b></div><div class="stat"><span>Trinkgeld</span><b id="tips">0,00 €</b></div><div class="stat"><span>Gesamt</span><b id="grand">0,00 €</b></div><div class="stat"><span>Kunden</span><b id="customers">0</b></div></div></section>
<section class="card"><div class="sectiontitle">Kalender</div><div class="toolbar"><input id="month" type="month"><button class="btn small" id="today">Heute</button></div><div class="calendar" id="cal"></div></section>
<section class="card"><div class="sectiontitle">Monatsabrechnung</div><div id="months"></div></section><section id="days"></section><div class="footer">© Hussein Alhami</div></main>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2>Einstellungen</h2><button class="icon" id="close">✕</button></div><div class="setting"><label>App-Titel</label><input id="stitle" value="Kunden-Tagebuch"></div><div class="setting"><label>Untertitel</label><input id="ssub" value="Kunden, Leistungen, Umsatz & Trinkgeld"></div><div class="setting"><label>Hintergrundfarbe</label><input id="bg" type="color" value="#f6f2ed"></div><div class="setting"><label>Hauptfarbe</label><input id="accent" type="color" value="#211b17"></div><button class="btn primary" id="saveSettings">Einstellungen speichern</button></div></div>
<script>
const KEY='kunden_tagebuch_v1',SK='kunden_tagebuch_settings_v1';let entries=JSON.parse(localStorage.getItem(KEY)||'[]'),settings=JSON.parse(localStorage.getItem(SK)||'{}'),editing=null;const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),today=()=>{let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},time=()=>{let d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function apply(){document.documentElement.style.setProperty('--bg',settings.bg||'#f6f2ed');document.documentElement.style.setProperty('--accent',settings.accent||'#211b17');$('title').textContent=settings.title||'Kunden-Tagebuch';$('sub').textContent=settings.sub||'Kunden, Leistungen, Umsatz & Trinkgeld'}function fields(){if(!editing){$('date').value=today();$('time').value=time()}}function clear(){['name','amount','tip','service','note'].forEach(x=>$(x).value='');editing=null;$('save').textContent='Eintrag speichern';$('cancel').classList.add('hidden');fields()}
function render(){let total=0,tips=0;entries.forEach(x=>{total+=+x.amount||0;tips+=+x.tip||0});$('total').textContent=euro(total);$('tips').textContent=euro(tips);$('grand').textContent=euro(total+tips);$('customers').textContent=entries.length;calendar();months();days()}
function calendar(){let key=$('month').value||today().slice(0,7),[y,m]=key.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),start=(first.getDay()+6)%7,c=$('cal');c.innerHTML='';['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(x=>{let w=document.createElement('div');w.className='week';w.textContent=x;c.appendChild(w)});for(let i=0;i<start;i++){let x=document.createElement('div');c.appendChild(x)}for(let d=1;d<=last.getDate();d++){let ds=y+'-'+pad(m)+'-'+pad(d),b=document.createElement('button');b.className='calday'+(ds===today()?' today':'')+(entries.some(e=>e.date===ds)?' has':'');b.textContent=d;if(entries.some(e=>e.date===ds)){let q=document.createElement('i');q.className='dot';b.appendChild(q)}b.onclick=()=>days(ds);c.appendChild(b)}}
function months(){let key=$('month').value||today().slice(0,7),list=entries.filter(e=>e.date.startsWith(key)),g={};list.forEach(e=>(g[e.date]??=[]).push(e));let sum=list.reduce((a,e)=>a+ +e.amount,0),tip=list.reduce((a,e)=>a+ +e.tip,0),html='<div class="stats"><div class="stat"><span>Umsatz</span><b>'+euro(sum)+'</b></div><div class="stat"><span>Trinkgeld</span><b>'+euro(tip)+'</b></div><div class="stat"><span>Gesamt</span><b>'+euro(sum+tip)+'</b></div><div class="stat"><span>Kunden</span><b>'+list.length+'</b></div></div>';Object.keys(g).sort((a,b)=>b.localeCompare(a)).forEach(d=>{let l=g[d],s=l.reduce((a,e)=>a+ +e.amount,0),t=l.reduce((a,e)=>a+ +e.tip,0);html+='<div class="month"><div class="monthrow"><div><div class="monthname">'+new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})+'</div><div class="monthcount">'+l.length+' Kunde'+(l.length===1?'':'n')+'</div></div><div class="monthsum">'+euro(s+t)+'<div class="monthtip">Umsatz '+euro(s)+' · Trinkgeld '+euro(t)+'</div></div></div></div>'});$('months').innerHTML=html}
function days(selected){let src=selected?entries.filter(e=>e.date===selected):entries,g={};[...src].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(e=>(g[e.date]??=[]).push(e));let out='';Object.keys(g).sort((a,b)=>b.localeCompare(a)).forEach(d=>{let l=g[d],s=l.reduce((a,e)=>a+ +e.amount,0),t=l.reduce((a,e)=>a+ +e.tip,0);out+='<section class="card day"><div class="dayhead"><div><div class="date">'+esc(new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}))+'</div><div class="count">'+l.length+' Kunde'+(l.length===1?'':'n')+'</div></div><div class="end">Endsumme<br><b>'+euro(s+t)+'</b><br>Umsatz '+euro(s)+' · Trinkgeld '+euro(t)+'</div></div>';l.forEach(e=>out+='<div class="row"><div><div class="name">'+esc(e.name)+'</div><div class="meta">'+esc(e.time)+(e.service?' · '+esc(e.service):'')+'</div>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'<div class="actions"><button class="btn small" onclick="edit(\''+e.id+'\')">Bearbeiten</button><button class="btn small danger" onclick="del(\''+e.id+'\')">Löschen</button></div></div><div class="money">'+euro(e.amount)+'<div class="tip">+ '+euro(e.tip)+'</div></div></div>');out+='</section>'});$('days').innerHTML=out||'<div class="card empty">Keine Einträge für diesen Tag.</div>'}
function edit(id){let e=entries.find(x=>x.id===id);if(!e)return;editing=id;$('name').value=e.name;$('amount').value=e.amount;$('tip').value=e.tip;$('date').value=e.date;$('time').value=e.time;$('service').value=e.service||'';$('note').value=e.note||'';$('save').textContent='Änderung speichern';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}function del(id){if(confirm('Diesen Eintrag wirklich löschen?')){entries=entries.filter(e=>e.id!==id);save();render()}}
$('save').onclick=()=>{let name=$('name').value.trim(),amount=parseFloat($('amount').value),tip=parseFloat($('tip').value||0);if(!name)return alert('Bitte Kundennamen eingeben.');if(!Number.isFinite(amount)||amount<0)return alert('Bitte einen gültigen Betrag eingeben.');let data={name,amount,tip:Number.isFinite(tip)&&tip>=0?tip:0,date:$('date').value,time:$('time').value,service:$('service').value.trim(),note:$('note').value.trim()};if(editing){let i=entries.findIndex(e=>e.id===editing);entries[i]={...entries[i],...data}}else entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...data});save();$('month').value=data.date.slice(0,7);clear();render()};$('cancel').onclick=clear;$('month').value=today().slice(0,7);$('month').onchange=render;$('today').onclick=()=>{$('month').value=today().slice(0,7);render();days(today())};$('settings').onclick=()=>{$('stitle').value=settings.title||'Kunden-Tagebuch';$('ssub').value=settings.sub||'Kunden, Leistungen, Umsatz & Trinkgeld';$('bg').value=settings.bg||'#f6f2ed';$('accent').value=settings.accent||'#211b17';$('modal').classList.add('show')};$('close').onclick=()=>$('modal').classList.remove('show');$('saveSettings').onclick=()=>{settings={title:$('stitle').value.trim()||'Kunden-Tagebuch',sub:$('ssub').value.trim()||'Kunden, Leistungen, Umsatz & Trinkgeld',bg:$('bg').value,accent:$('accent').value};localStorage.setItem(SK,JSON.stringify(settings));apply();$('modal').classList.remove('show')};apply();fields();render();setInterval(()=>{if(!editing&&!$('name').value&&!$('amount').value&&$('date').value!==today())fields()},30000);
</script></body></html>
